<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Cờ Vua</title>
    <!-- Nhúng CSS của thư viện chessboard.js -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 10px;
            color: #f5f5f5;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2a2a35;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #myBoard {
            width: 400px;
            max-width: 90vw;
            margin: 10px 0;
            border: 4px solid #333;
            border-radius: 4px;
        }
        .info-panel {
            margin-top: 15px;
            text-align: center;
            font-size: 1.1rem;
        }
        .status {
            font-weight: bold;
            color: #ffcc00;
        }
        .btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 1rem;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bàn Cờ Vua Đơn Giản</h1>
        <div id="myBoard"></div>
        <div class="info-panel">
            Trạng thái: <span id="status" class="status">Lượt của Trắng</span>
        </div>
        <button class="btn" id="restartBtn">Chơi Lại</button>
    </div>

    <!-- Tải JQuery, Chess.js (logic) và Chessboard.js (giao diện) từ CDN -->
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function onDragStart (source, piece, position, orientation) {
            // Không cho phép đi quân nếu game kết thúc
            if (game.game_over()) return false;

            // Chỉ cho phép đi quân đúng lượt màu
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            // Kiểm tra nước đi hợp lệ trong logic cờ vua
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Mặc định phong Hậu nếu tốt đi xuống cuối hàng
            });

            // Nếu nước đi bất hợp pháp, trả quân cờ về vị trí cũ
            if (move === null) return 'snapback';

            updateStatus();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        // Cập nhật trạng thái hiển thị (Chiếu tướng, Chiếu hết, Lượt đi)
        function updateStatus () {
            var status = '';
            var moveColor = (game.turn() === 'b') ? 'Đen' : 'Trắng';

            if (game.in_checkmate()) {
                status = 'Trò chơi kết thúc, ' + moveColor + ' bị chiếu hết!';
            }
            else if (game.in_draw()) {
                status = 'Trò chơi kết thúc, hòa cờ!';
            }
            else {
                status = 'Lượt của ' + moveColor;
                if (game.in_check()) {
                    status += ' (Đang bị CHIẾU!)';
                }
            }

            $status.html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com{piece}.png'
        };
        
        board = Chessboard('myBoard', config);
        updateStatus();

        // Xử lý sự kiện nút Chơi Lại
        $('#restartBtn').on('click', function() {
            game.reset();
            board.start();
            updateStatus();
        });
    </script>
</body>
</html>
